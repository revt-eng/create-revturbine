name: PR gate

# Check level L1 (EP-1747) through the shared check-level workflow on our
# CodeBuild runners. This repository is public, so it calls the generated copy
# in .github/workflows/ci-level.yml (never edit it here; the devkit regenerates
# it), which owns the runner label and sends pull requests from forks to
# GitHub-hosted runners. There is no root package.json, so the job passes its
# command and installs nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci-level.yml
    with:
      level: l1
      node-version: '24'
      package-manager: none
      # Smoke — each launcher reaches `revturbine init` via npx @latest.
      # Both packages are runtime launchers with no declared @revturbine/cli
      # dependency; they fetch it at run time. Assert each reaches init's OWN
      # help — grepping for "init" anywhere would also match "instance".
      command: |
        echo "— create-revturbine —"
        node packages/create-revturbine/index.mjs --help > cr.txt 2>&1 || true
        grep -qE "^Usage: revturbine init[|]create \[options\]" cr.txt || { echo "::error::create-revturbine did not reach init"; cat cr.txt; exit 1; }

        echo "— revturbine (create) —"
        node packages/revturbine/index.mjs create --help > rv.txt 2>&1 || true
        grep -qE "^Usage: revturbine init[|]create \[options\]" rv.txt || { echo "::error::revturbine create did not reach init"; cat rv.txt; exit 1; }

        echo "Both launchers reach the CLI."

        # EP-1747 phase 5: the Release prerelease script, and the line its
        # workflow (release-prerelease.yml) stamps with the Release's CLI tag.
        node --test scripts/release-prerelease.test.mjs
        for launcher in packages/*/index.mjs; do
          grep -qx "const CLI_TAG = 'latest';" "$launcher" || { echo "::error::$launcher has no CLI_TAG line for release-prerelease.yml to stamp"; exit 1; }
        done
